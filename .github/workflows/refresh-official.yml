name: Refresh official integrations

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/refresh-official.mjs
      - run: node scripts/validate-catalog.mjs
      - name: Commit refreshed catalogue
        run: |
          if git diff --quiet -- public/data/official.json; then
            echo "Official catalogue is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/official.json
          git commit -m "Refresh official integrations catalogue"
          git push
